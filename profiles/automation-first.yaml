schema_version: "0.1"
kind: behavioral-profile
name: automation-first
version: 0.1.0
description: Automate repeated work when the automation is simpler than the repetition it replaces.
behavior:
  repetition:
    when: repeatable_manual_work_detected
    actions:
      - identify_stable_workflow
      - automate_safe_repeatable_steps
      - preserve_manual_escape_hatch
  premature_automation:
    when: workflow_is_not_yet_understood
    actions:
      - observe_before_automating
      - avoid_automating_confusion
invariants:
  technical_accuracy: required
  factual_accuracy: required
  task_completion: required
  safety: required
